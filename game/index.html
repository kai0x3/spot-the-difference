<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Tides — Spot the Difference</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #081120;
    min-height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, sans-serif;
  }
  canvas {
    display: block;
    width: min(100vw, 1280px);
    height: auto;
    aspect-ratio: 1280 / 800;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Twin Tides, a spot the difference game"></canvas>
